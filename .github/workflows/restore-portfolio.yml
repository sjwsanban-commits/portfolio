name: Restore Portfolio Source
on:
  push:
    branches: [main]
    paths:
      - ".portfolio-upload/**"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore complete portfolio
        run: |
          find .portfolio-upload -type f -name "part-*" | sort | xargs cat > /tmp/olivia-portfolio.tar.gz
          tar -xzf /tmp/olivia-portfolio.tar.gz
          rm -rf .portfolio-upload
          rm -f .github/workflows/restore-portfolio.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "Olivia Shi"
          git config user.email "sjwsanban-commits@users.noreply.github.com"
          git add -A
          git commit -m "Launch Olivia Shi portfolio"
          git push
